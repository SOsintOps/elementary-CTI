services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pestilentia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pestilentia}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bound to loopback only — never expose Postgres on the LAN.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pestilentia}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PEST_DB_URL: postgresql://${POSTGRES_USER:-pestilentia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pestilentia}
      PEST_LOG_LEVEL: ${PEST_LOG_LEVEL:-INFO}
      PEST_API_BASE_URL: https://api.ransomware.live/v2
      PEST_POLL_INTERVAL_HOURS: "4"
      PEST_WEB_HOST: "0.0.0.0"
      PEST_WEB_PORT: "8000"
      PEST_SECRET_KEY: ${PEST_SECRET_KEY:?set PEST_SECRET_KEY in .env}
      PEST_AUTH_USER: ${PEST_AUTH_USER:-}
      PEST_AUTH_PASS: ${PEST_AUTH_PASS:-}
      # Secure flag on the session cookie: true behind TLS (production),
      # false only for plain-HTTP LAN use (set in .env until Caddy lands).
      PEST_COOKIE_SECURE: ${PEST_COOKIE_SECURE:-true}
      # The compose network (pinned below) — requests arriving from it are
      # the proxy's, so its X-Forwarded-For is trusted for user_activity.
      PEST_TRUSTED_PROXY_CIDR: ${PEST_TRUSTED_PROXY_CIDR:-172.28.0.0/16}
      # Empty is a supported state, not a misconfiguration: with no key the
      # analysis driver logs "idle" once per cycle and the rest of the app runs.
      PEST_AI_NVIDIA_API_KEY: ${PEST_AI_NVIDIA_API_KEY:-}
    volumes:
      # The ATT&CK bundle and the curated feeds, fetched on the host (DEPLOY.md
      # §0). Read-only, so a catalogue cannot change under a run in progress,
      # and a bind rather than a COPY because a 54 MB layer would be rebuilt
      # every time a publisher updates a file the code only ever reads.
      - ./data:/app/data:ro
    # No host port: the app is reachable only through the caddy proxy.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Site address: localhost (default), a LAN name/IP, or — at step 12,
      # after the OWASP audit — the real public domain.
      PEST_DOMAIN: ${PEST_DOMAIN:-localhost}
      # "internal" = Caddy's own CA (self-signed). Set to an ACME e-mail
      # address to switch the site to Let's Encrypt.
      PEST_TLS_MODE: ${PEST_TLS_MODE:-internal}
      # Certificate served to no-SNI handshakes (i.e. clients dialing a raw
      # IP); set to the LAN IP when that is one of the site addresses.
      PEST_DEFAULT_SNI: ${PEST_DEFAULT_SNI:-localhost}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  scheduler:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PEST_DB_URL: postgresql://${POSTGRES_USER:-pestilentia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pestilentia}
      PEST_LOG_LEVEL: ${PEST_LOG_LEVEL:-INFO}
      PEST_API_BASE_URL: https://api.ransomware.live/v2
      PEST_POLL_INTERVAL_HOURS: "4"
      PEST_SECRET_KEY: ${PEST_SECRET_KEY:?set PEST_SECRET_KEY in .env}
      # This is the process that actually analyses articles, so without the key
      # the pipeline is off. See the note on the web service.
      PEST_AI_NVIDIA_API_KEY: ${PEST_AI_NVIDIA_API_KEY:-}
    volumes:
      - ./data:/app/data:ro
    command: ["uv", "run", "python", "-m", "pestilentia"]
    # No HTTP server here — disable the image's web HEALTHCHECK (the slim image
    # has no pgrep either). The restart policy still recovers a crashed process.
    healthcheck:
      test: ["NONE"]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  # Pinned so PEST_TRUSTED_PROXY_CIDR is deterministic instead of depending
  # on docker's network-creation order. 172.17/16 and 172.18/16 are already
  # taken on the host; changing this requires `docker compose down` first.
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
