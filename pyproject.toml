[project]
name = "pestilentia"
version = "0.9.0.dev0"
description = "Elementary CTI — ransomware threat intelligence aggregator with multi-source support, MITRE ATT&CK / Ransomwhere / deepdarkCTI enrichment, and a web UI"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Sandro Rossetti", email = "sandro.rossetti.study@gmail.com" },
]
dependencies = [
    "httpx>=0.27",
    "anyio>=4.0",
    "sqlalchemy>=2.0",
    "apscheduler>=3.11.3,<4",
    "thefuzz[speedup]>=0.22",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.52.1",
    "jinja2>=3.1",
    "plotly>=6.0",
    "pillow>=10.0",
    "psycopg2-binary>=2.9",
    "markdown>=3.10.3",
    "python-multipart>=0.0.26",
    "alembic>=1.13",
    "feedparser>=6.0.12",
    "trafilatura>=2.2.0",
    "model2vec>=0.8.2",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-httpx>=0.30",
    "anyio[trio]>=4.0",
    "ruff>=0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pestilentia"]

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["pestilentia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
